# Shared Ghostty settings. install.sh includes this from your own ~/.config/ghostty/config
# (`config-file = dotfiles.conf`), which stays a real file for this machine's settings
# (window position, a utheme block). Included files load after that file, in order, so a
# colour theme included after this line (utheme's) wins over `theme` here.

font-family = TX-02
font-thicken = true
font-size = 16
# no programming ligatures
font-feature = -calt

theme = Cobalt Next Minimal

macos-titlebar-style = tabs
title = " "
unfocused-split-opacity = 0.7
unfocused-split-fill = "#333333"

window-width = 120
window-height = 30

mouse-hide-while-typing = true
scrollback-limit = 30000000
copy-on-select = clipboard
auto-update-channel = stable

# Quick terminal from anywhere: Option+`
keybind = global:option+grave_accent=toggle_quick_terminal
# Shift+Enter sends a newline to TUIs like Claude Code instead of submitting
keybind = shift+enter=text:\x1b\r
